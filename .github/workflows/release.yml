name: Release

# Publishes @brain-db/cli to npm when a version tag is pushed.
#
# The tag normally comes from `release-please.yml`, not from a shell: merging
# the Release PR it maintains bumps the version in package.json, writes the
# CHANGELOG, and creates the tag. Tagging by hand still works and is the
# escape hatch:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The version check below is what makes both paths safe — a tag that disagrees
# with package.json cannot publish.
#
# Auth is OIDC **Trusted Publishing** — no NPM_TOKEN lives in this repo. The
# job exchanges the workflow's short-lived GitHub OIDC identity for a scoped,
# single-use publish credential, and npm attaches build provenance
# automatically. This is why it requests `id-token: write`.
#
# ONE-TIME registry setup (done on npmjs.com, not here) — register this repo +
# this workflow as a Trusted Publisher:
#   npmjs.com → package → Settings → Trusted Publisher → GitHub Actions:
#     owner arc-labs-ai, repo brain-kit, workflow release.yml
# The package is scoped (@brain-db) and `publishConfig.access` is already
# "public", so the first publish creates it as a public scoped package. Until
# the trusted publisher is configured the publish step fails closed (it never
# falls back to a token).
#
# The `release` environment gates the publish; require reviewers on it
# (Settings → Environments → release) to add a manual approval before anything
# goes public.

on:
  push:
    tags:
      - "v*"

  # Escape hatch for a tag that was cut but never published.
  #
  # This is not hypothetical. Events raised with the default `GITHUB_TOKEN` do
  # not start workflow runs — GitHub's recursion guard — so when
  # `RELEASE_PLEASE_TOKEN` is unset, release-please creates the tag and the
  # GitHub Release and this workflow never fires. It has already cost one
  # release elsewhere in this org.
  #
  # `ref: ${{ inputs.tag || github.ref }}` below means dispatching from `main`
  # runs the CURRENT workflow file against the TAG's source, so a fix to this
  # file can publish an already-cut tag. Force-moving the tag would also work
  # and is worse: it rewrites history that a registry may already reference.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. "v0.1.0"'
        required: true
        type: string

  # Called by `release-please.yml` IN THE SAME RUN, which is what removes the
  # need for a PAT.
  #
  # The recursion guard only suppresses NEW events raised with the default
  # `GITHUB_TOKEN` — a tag push is such an event, a job in the same run is not.
  # So release-please can hand the publish straight to this workflow and no
  # `RELEASE_PLEASE_TOKEN` has to exist, be stored, or be rotated.
  #
  # The split the comment above describes is preserved, because it is a split
  # between JOBS and not between files: the third-party release-please action
  # runs in a job with no `id-token: write`, and this job, which holds the
  # publish identity, runs no third-party action.
  workflow_call:
    inputs:
      tag:
        description: "Tag just created by release-please."
        required: true
        type: string

# No repo-wide write; the job opts into `id-token: write` for OIDC.
permissions:
  contents: read

jobs:
  npm:
    name: Publish → npm
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC → npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1; Node 22 ships an
      # older bundled npm, so upgrade before publishing.
      - name: Upgrade npm (trusted-publishing support)
        run: npm install -g npm@latest

      - name: Verify tag matches package version
        run: |
          RAW="${{ inputs.tag || github.ref_name }}"
          TAG="${RAW#v}"
          VER="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$VER"
          test "$TAG" = "$VER" || { echo "::error::tag $TAG != package version $VER"; exit 1; }

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # OIDC trusted publishing: no NODE_AUTH_TOKEN. npm detects the trusted
      # publisher and attaches provenance automatically.
      - name: Publish
        run: npm publish
